<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lou Tchappé · Menu del giorno</title>
  <meta name="description" content="Lou Tchappé, Cogne — piatti del giorno e carta dei vini.">
  <meta name="theme-color" content="#F6F1E9">
  <link rel="icon" type="image/png" href="logo-menu.png">
  <link rel="stylesheet" href="css/menu.css?v=1">
</head>
<body>
  <main class="page">
    <header class="brand">
      <img src="logo-menu.png" alt="" class="brand-logo" width="130" height="165">
      <h1 class="brand-name">Lou Tchappé</h1>
      <p class="brand-place">Cogne · Valle d'Aosta</p>
    </header>

    <nav class="lang" aria-label="Lingua / Language / Langue">
      <button type="button" data-lang="it" lang="it">Italiano</button>
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="fr" lang="fr">Français</button>
    </nav>

    <section class="today" aria-labelledby="today-title">
      <div class="section-head">
        <h2 id="today-title" data-t="title">Proposte del giorno</h2>
        <p class="today-date" id="today-date"></p>
      </div>
      <div id="dishes" aria-live="polite">
        <p class="state" data-t="loading">Un momento…</p>
      </div>
    </section>

    <section class="wine" aria-labelledby="wine-title">
      <h2 id="wine-title" data-t="wineTitle">La carta dei vini</h2>
      <p data-t="wineText">Etichette valdostane e italiane, scelte in cantina.</p>
      <a class="wine-btn" id="wine-link" href="https://cantina360.it/c/b403944e-895e-4dd6-8d46-fd5c207cfcda?lang=it" target="_blank" rel="noopener noreferrer">
        <span data-t="wineBtn">Apri la carta dei vini</span>
        <span aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="foot">
      <p class="allergens" data-t="allergens">Allergie o intolleranze? Chiedi al nostro personale: ti indicheremo gli ingredienti di ogni piatto.</p>
      <p class="foot-name">Lou Tchappé · Cogne</p>
    </footer>
  </main>
  <script src="js/menu.js?v=1"></script>
</body>
</html>
