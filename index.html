<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lou Tchappé · Carta dei Vini</title>
  <meta name="description" content="Lou Tchappé, Cogne — Carta dei vini e proposte del giorno.">
  <meta name="theme-color" content="#0D0A08">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>

  <main class="pagina">

    <!-- SFONDO FOTO -->
    <div class="sfondo" aria-hidden="true"></div>
    <div class="sfondo-overlay" aria-hidden="true"></div>

    <!-- CONTENUTO -->
    <div class="contenuto">

      <!-- BRAND -->
      <header class="brand" data-animate="fade-in">
        <div class="brand__badge">
          <img src="logo.png" alt="Lou Tchappé" class="brand__logo" width="100" height="100">
        </div>
        <p class="brand__name">Lou Tchappé</p>
        <p class="brand__luogo">Cogne · Valle d'Aosta</p>
      </header>

      <!-- CARTA DEI VINI -->
      <section class="sezione" data-animate="fade-in">
        <div class="sezione__header">
          <span class="sezione__linea"></span>
          <h2 class="sezione__titolo">🍷</h2>
          <span class="sezione__linea"></span>
        </div>
        <div class="carta-vini-btns">
          <a href="https://cantina360.it/c/b403944e-895e-4dd6-8d46-fd5c207cfcda?lang=it"
             target="_blank" rel="noopener noreferrer"
             class="carta-btn">
            Carta dei Vini
          </a>
          <a href="https://cantina360.it/c/b403944e-895e-4dd6-8d46-fd5c207cfcda?lang=fr"
             target="_blank" rel="noopener noreferrer"
             class="carta-btn">
            Carte des Vins
          </a>
          <a href="https://cantina360.it/c/b403944e-895e-4dd6-8d46-fd5c207cfcda?lang=en"
             target="_blank" rel="noopener noreferrer"
             class="carta-btn">
            Wine List
          </a>
        </div>
      </section>

      <!-- DIVISORE -->
      <div class="divisore" data-animate="fade-in" aria-hidden="true"></div>

      <!-- PROPOSTE DEL GIORNO -->
      <section class="sezione" data-animate="fade-in">
        <div class="sezione__header">
          <span class="sezione__linea"></span>
          <h2 class="sezione__titolo">🍽️</h2>
          <span class="sezione__linea"></span>
        </div>

        <div class="proposte-header">
          <p class="proposte-titolo" id="proposte-titolo">Proposte del Giorno</p>
          <p class="proposte-data" id="data-oggi"></p>
        </div>

        <!-- Bottoni lingua -->
        <div class="proposte-lang" id="proposte-lang">
          <button class="proposte-lang__btn proposte-lang__btn--active" data-lang="it">ITA</button>
          <button class="proposte-lang__btn" data-lang="fr">FRA</button>
          <button class="proposte-lang__btn" data-lang="en">ENG</button>
        </div>

        <div class="proposte__lista" id="proposte-lista">
          <div class="proposte__loading">
            <span class="proposte__spinner" aria-hidden="true"></span>
            <p>Caricamento...</p>
          </div>
        </div>

        <div class="proposte__vuoto" id="proposte-vuoto" style="display:none">
          <p>🍽️</p>
          <p>Le proposte di oggi non sono ancora disponibili.</p>
          <p>Chiedi al personale!</p>
        </div>

      </section>

      <footer class="footer" data-animate="fade-in">
        <span class="footer__snowflake" aria-hidden="true">❆</span>
        <span class="footer__text">Lou Tchappé&nbsp;•&nbsp;Cogne&nbsp;•&nbsp;Valle d'Aosta</span>
      </footer>

    </div>
  </main>

  <script src="script.js?v=9"></script>
</body>
</html>
